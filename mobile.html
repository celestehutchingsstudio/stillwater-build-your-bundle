<!doctype html>
<html lang="en" data-force="iphone">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stillwater Build Your Bundle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: prototype controls on top, then the storefront inside a device frame (full width on desktop, a 390px phone on "Mobile").
   The storefront lays itself out with container queries, so the phone frame and a real phone get the same mobile layout.
   Tokens come from the Stillwater style sheet in Figma: one warm light palette, Cormorant Garamond for display, Inter for UI. */
:root{
  --paper:#f6f2ec; --sand:#ede5da; --line:#cfc3b3; --ink:#141414; --muted:#6e655c; --moss:#3f5a45; --rust:#9a3b2e;
  --on-ink:#ffffff; --scrim:rgba(20,20,20,.48); --shell:#e4ddd2; --shell-fg:#141414; --ring:#3f5a45;
  --shop:#5a31f4; --paypal:#ffc439;
  --sab:env(safe-area-inset-bottom,0px);
  --display:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--shell);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.43;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--shell)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
img{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
[hidden]{display:none!important}
@container app (max-width:900px){.wide-only{display:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- prototype controls ---------- */
.ctl{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--shell);color:var(--shell-fg);border-bottom:1px solid var(--line);z-index:80}
.ctl-name{font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.ctl-name span{color:var(--muted);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{padding:6px 12px;font-size:12px;font-weight:500;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.ctl select{background:var(--paper);border:1px solid var(--ink);border-radius:0;padding:6px 8px;font-size:12px;min-height:32px;max-width:100%}
.ctl .ghost{font-size:12px;font-weight:500;text-decoration:underline;text-underline-offset:3px;min-height:32px;padding:0 4px}
.ctl .spacer{flex:1}
@media (max-width:560px){.ctl-name span{display:none}.ctl .spacer{display:none}}

/* ---------- device ---------- */
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch;overflow:hidden}
.phone-box{flex:1;min-width:0;display:flex}
.device{position:relative;flex:1;min-width:0;background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
.screen{position:relative;flex:1;min-height:0;display:flex;transform:translateZ(0);overflow:hidden;container-type:inline-size;container-name:app}
.statusbar,.island,.homebar{display:none}
/* iPhone 15 frame: 393 × 852 screen, 54px status bar, 34px home-indicator zone. Scaled to fit with --s. */
body.phone{--sab:21px}
body.phone .stage{padding:16px;align-items:center}
body.phone .phone-box{flex:none;width:calc(419px * var(--s,1));height:calc(878px * var(--s,1))}
body.phone .device{flex:none;width:419px;height:878px;transform:scale(var(--s,1));transform-origin:0 0;border:13px solid #161616;border-radius:68px;box-shadow:0 0 0 2px #4a4845,0 0 0 3px #1d1d1d,0 32px 80px rgba(20,20,20,.32)}
body.phone .statusbar{display:flex;flex:none;height:54px;align-items:center;justify-content:space-between;padding:6px 30px 0 52px;background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",sans-serif;font-weight:600;font-size:17px;letter-spacing:-.02em;color:var(--ink);position:relative;z-index:5}
body.phone .statusbar .icons{display:flex;gap:6px;align-items:center}
body.phone .island{display:block;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;border-radius:20px;background:#000;z-index:100}
body.phone .homebar{display:block;position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:139px;height:5px;border-radius:3px;background:var(--ink);z-index:100;pointer-events:none}
body.phone .toast{bottom:auto;top:12px;transform:translate(-50%,-12px)}
body.phone .toast.show{transform:translate(-50%,0)}
.scroller{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;overscroll-behavior:contain}

/* ---------- type ---------- */
.d40{font-family:var(--display);font-weight:500;font-size:40px;line-height:44px;margin:0;text-wrap:balance}
.d30{font-family:var(--display);font-weight:500;font-size:30px;line-height:36px;margin:0;text-wrap:balance}
.d24{font-family:var(--display);font-weight:500;font-size:24px;line-height:32px;margin:0}
.d21{font-family:var(--display);font-weight:500;font-size:21px;line-height:28px;margin:0}
.d18{font-family:var(--display);font-weight:500;font-size:18px;line-height:24px;margin:0}
.eyebrow{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.muted{color:var(--muted)}
.t12{font-size:12px;line-height:20px}
.t14{font-size:14px;line-height:20px}
.price{font-size:20px;line-height:28px;font-weight:500;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.link{font-size:12px;line-height:16px;text-decoration:underline;text-underline-offset:3px;min-height:24px;display:inline-flex;align-items:center}
.link:hover{color:var(--muted)}

/* ---------- buttons, tags ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 24px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);background:transparent;color:var(--ink);transition:background .15s,color .15s;text-align:center}
.btn:hover{background:var(--sand)}
.btn.solid{background:var(--ink);color:var(--on-ink)}
.btn.solid:hover{background:#2c2a27}
.btn.cream{background:var(--paper);border-color:var(--paper)}
.btn.cream:hover{background:var(--sand)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:14px;height:14px;flex:none}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.04em;background:var(--sand);color:var(--ink);white-space:nowrap}
.tag.ok{background:transparent;border:1px solid var(--moss);color:var(--moss);padding:3px 7px}
.tag.lost{background:transparent;border:1px solid var(--rust);color:var(--rust);padding:3px 7px}
.ic{width:16px;height:16px;flex:none;display:block}

/* ---------- header ---------- */
.announce{background:var(--ink);color:#fff;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.04em;text-align:center;padding:10px 16px}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:76px;padding:0 48px;border-bottom:1px solid var(--line)}
.bar nav{display:flex;gap:28px;font-size:12px}
.bar nav button,.bar .util button{font-size:12px;line-height:16px;min-height:32px}
.bar nav button:hover,.bar .util button:hover{text-decoration:underline;text-underline-offset:4px}
.bar nav button[aria-current="page"]{text-decoration:underline;text-underline-offset:4px}
.logo{font-family:var(--display);font-weight:500;font-size:30px;letter-spacing:.12em;line-height:36px}
.bar .util{display:flex;gap:28px;justify-content:flex-end}
.bar .menu{display:none}
.bar .icon-only{display:none;position:relative;min-width:40px;min-height:40px;align-items:center;justify-content:center}
.bar .icon-only .ic{width:20px;height:20px}
.bar .icon-only.bag{display:inline-flex}
.badge{position:absolute;top:4px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--ink);color:#fff;font-size:10px;line-height:16px;font-weight:600;text-align:center}
/* Nav collapses to a hamburger as soon as the tabs, logo and utility links stop fitting comfortably in one row. */
@container app (max-width:1100px){
  .bar{padding:0 32px;grid-template-columns:1fr auto 1fr}
  .bar nav,.bar .util .wide{display:none}
  .bar .menu{display:inline-flex;min-height:40px;min-width:40px;align-items:center;justify-self:start;margin-left:-8px;padding-left:8px}
  .bar .util{gap:0}
}
@container app (max-width:900px){
  .announce{padding:8px 16px;text-transform:uppercase;letter-spacing:.12em}
  .announce .wide-only{display:none}
  .bar{height:56px;padding:0 16px;grid-template-columns:56px 1fr 96px}
  .bar .icon-only{display:inline-flex}
  .logo{font-size:23px;line-height:28px;text-align:center}
}
.menu-panel{position:relative;width:360px;max-width:88%;height:100%;background:var(--paper);display:flex;flex-direction:column;animation:slidel .28s ease-out;box-shadow:12px 0 40px rgba(20,20,20,.12)}
@keyframes slidel{from{transform:translateX(-100%)}}
.menu-panel nav{display:flex;flex-direction:column;padding:8px 24px}
.menu-panel nav button{display:flex;justify-content:space-between;align-items:center;text-align:left;font-family:var(--display);font-weight:500;font-size:24px;line-height:32px;padding:14px 0;border-bottom:1px solid var(--line);min-height:56px}
.menu-panel nav button[aria-current="page"]{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.menu-panel .sub{display:flex;flex-direction:column;gap:4px;padding:24px}
.menu-panel .sub button{text-align:left;font-size:12px;line-height:16px;min-height:40px}

/* ---------- page shells ---------- */
.page{min-height:100%}
.pad{padding:32px 48px 48px}
@container app (max-width:900px){.pad{padding:20px 20px 40px}}

/* ---------- product page ---------- */
.pdp{display:grid;grid-template-columns:minmax(0,760fr) minmax(0,520fr);gap:64px;align-items:start}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gallery img{width:100%;aspect-ratio:372/440;object-fit:cover;background:var(--sand)}
.info{display:flex;flex-direction:column;gap:20px;padding-top:8px;position:sticky;top:24px}
.rating{display:flex;gap:8px;font-size:12px;line-height:20px}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:10px 20px;font-size:12px;line-height:16px;font-weight:500;border:1px solid var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip.sold{border-color:var(--line);color:var(--muted);text-decoration:line-through}
.chip.sold[aria-pressed="true"]{background:var(--line);color:var(--ink)}
.promo-card{background:var(--sand);padding:28px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.tiers{display:flex;gap:8px;flex-wrap:wrap}
.tiers .tag{background:var(--paper)}
.acc{border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-size:12px;line-height:16px;cursor:pointer;min-height:48px}
.acc summary::-webkit-details-marker{display:none}
.acc details[open] summary .ic{transform:rotate(45deg)}
.acc summary .ic{transition:transform .2s}
.acc p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:20px;max-width:60ch}
.mgallery{display:none}
@container app (max-width:900px){
  .pdp{grid-template-columns:1fr;gap:24px}
  .info{position:static}
}
@container app (max-width:900px){
  .pdp{margin:-20px -20px 0}
  .gallery{display:none}
  .mgallery{display:block;position:relative}
  .mgallery .gtrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .mgallery .gtrack::-webkit-scrollbar{display:none}
  .mgallery .gtrack{aspect-ratio:390/440;width:100%;max-height:600px}
  .mgallery img{flex:none;width:100%;height:100%;max-width:none;object-fit:cover;scroll-snap-align:start}
  .dots{position:absolute;left:20px;bottom:16px;display:flex;gap:8px;align-items:center}
  .dots i{width:4px;height:3px;background:rgba(255,255,255,.7);display:block;transition:width .2s,background .2s}
  .dots i.on{width:16px;background:var(--ink)}
  .crumb{text-transform:uppercase!important;letter-spacing:.1em!important}
  .rating .rev{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .info .chip{min-height:40px;padding:10px 20px;min-width:80px;text-transform:uppercase;letter-spacing:.1em}
  .promo-card .tiers{gap:24px;padding:0 8px}
  .promo-card .tiers .tag{background:none;padding:4px 0;letter-spacing:.1em;text-transform:uppercase}
  .acc summary{text-transform:uppercase;letter-spacing:.1em}
  .info{padding:4px 20px 0;gap:16px}
  .info .d40{font-size:30px;line-height:36px}
  .info .btn.block{width:100%}
  .promo-card{padding:20px}
  .promo-card .btn{width:100%}
}

/* ---------- builder ---------- */
.builder-page{display:grid;grid-template-columns:minmax(0,1fr) 500px;gap:48px;padding:0 48px;align-items:start}
.products{display:flex;flex-direction:column;gap:80px;padding:48px 0 64px;min-width:0}
.section{display:flex;flex-direction:column;gap:24px;scroll-margin-top:24px}
.banner{position:relative;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;gap:16px;padding:32px;color:#fff;background:var(--muted) center/cover no-repeat;isolation:isolate}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,20,20,.18) 0%,rgba(20,20,20,.6) 100%);z-index:-1}
.banner h2,.banner p{text-shadow:0 1px 12px rgba(20,20,20,.45)}
.banner p{margin:0;font-size:16px;line-height:24px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 20px}
.tile{display:flex;flex-direction:column;gap:16px;min-width:0}
.tile .imgbtn{position:relative;display:block;aspect-ratio:1;overflow:hidden;background:var(--sand);width:100%}
.tile .imgbtn img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.tile .imgbtn:hover img{transform:scale(1.04)}
.tile .imgbtn .tag{position:absolute;left:0;top:0}
.tile .imgbtn .qv{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(246,242,236,.94);font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:8px;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
.tile .imgbtn:hover .qv,.tile .imgbtn:focus-visible .qv{opacity:1;transform:none}
.tile .namebtn{text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .namebtn .d18{white-space:nowrap;overflow:hidden;text-overflow:clip}
.tile .namebtn:hover .d18{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.tile .btn{padding:12px 8px;letter-spacing:.04em}
.tile .btn.added{background:var(--ink);color:#fff}
.side{position:sticky;top:0;padding:48px 32px;display:flex;flex-direction:column;gap:48px;min-width:0}
.builder{display:flex;flex-direction:column;gap:24px}
.builder .intro{display:flex;flex-direction:column;gap:8px}
.builder .intro p{margin:0;font-size:17px;line-height:24px}
.sizebtns{display:flex;gap:12px;flex-wrap:wrap}
.sizebtns .btn{padding:12px 24px}
.sizebtns .btn[aria-pressed="true"]{background:var(--ink);color:#fff}
.slots{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:20px}
.slot{display:flex;flex-direction:column;gap:8px;min-width:0}
.slot .ph{position:relative;aspect-ratio:1;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);width:100%;background:transparent}
.slot .ph:hover{background:var(--sand)}
.slot.filled .ph{border:1px solid var(--line);background:var(--sand);overflow:hidden}
.slot.filled .ph img{width:100%;height:100%;object-fit:cover}
.slot .rm{position:absolute;top:6px;right:6px;width:28px;height:28px;background:var(--paper);display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.slot .rm:hover{background:#fff}
.slot .lbl{font-size:12px;line-height:20px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.filled .lbl{color:var(--ink)}
.slot .lbl .sh{display:none}
.slot.pop .ph{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.summary{display:flex;flex-direction:column;gap:4px}
.summary .msg{font-size:12px;line-height:20px;color:var(--muted)}
.summary .msg.ok{color:var(--moss)}
.promo{position:relative;padding:32px;color:#fff;display:flex;flex-direction:column;gap:16px;align-items:flex-start;isolation:isolate;background:var(--muted) center/cover}
.promo::before{content:"";position:absolute;inset:0;background:rgba(20,20,20,.52);z-index:-1}
.promo p{margin:0;font-size:16px;line-height:24px}
.mobile-bar{display:none}
@container app (max-width:1180px){
  .builder-page{grid-template-columns:minmax(0,1fr) 400px;gap:32px;padding:0 32px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .side{padding:40px 0}
}
@container app (max-width:900px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .builder-page{grid-template-columns:minmax(0,1fr) 340px}
  .slots{gap:12px}
}
@container app (max-width:900px){
  .builder-page{display:flex;flex-direction:column-reverse;padding:0;gap:0}
  .side{position:static;padding:32px 16px;gap:24px}
  .builder .intro p{font-size:14px;line-height:20px}
  .sizebtns .btn{flex:1;padding:12px 8px}
  .slots{gap:16px}
  .slots[style*="--n:4"]{gap:12px}
  .slots[style*="--n:4"] .lbl .lg{display:none}
  .slots[style*="--n:4"] .lbl .sh{display:inline}
  .products{padding:0 16px 48px;gap:64px}
  .section{gap:16px}
  .banner{min-height:220px;padding:20px;gap:12px}
  .banner h2{font-size:30px;line-height:36px}
  .banner p{font-size:14px;line-height:20px}
  .grid{gap:32px 12px}
  .tile .imgbtn .qv{display:none}
  .promo{padding:28px 16px}
  .promo .d30{font-size:30px}
  .promo{gap:12px}
  .promo p{font-size:14px;line-height:20px}
  .promo .promo-btn{background:none;border:0;color:#fff;min-height:24px;padding:0;font-size:14px;line-height:20px;letter-spacing:0;text-transform:none;text-decoration:underline;text-underline-offset:3px}
  .mobile-bar{position:sticky;bottom:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 16px calc(12px + var(--sab));background:var(--paper);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .25s}
  .mobile-bar.show{transform:none}
  .mobile-bar .mb-text{flex:1;min-width:0;display:flex;flex-direction:column}
  .mobile-bar .btn{min-height:44px;padding:10px 16px}
}

/* ---------- review ---------- */
.back{display:inline-flex;align-items:center;gap:8px;font-size:12px;line-height:16px;min-height:32px}
.back:hover{text-decoration:underline;text-underline-offset:3px}
.cols{display:grid;grid-template-columns:minmax(0,840fr) minmax(0,440fr);gap:64px;align-items:start;margin-top:24px}
.bundle-col{display:flex;flex-direction:column;gap:24px;min-width:0}
.rewards{display:flex;flex-direction:column;gap:12px}
.rewards .msgrow{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.track{height:4px;background:var(--line);position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:var(--moss);transition:width .35s}
.tierrow{display:grid;grid-template-columns:repeat(var(--n,4),1fr)}
.tierrow span{display:flex;gap:8px;align-items:center;font-size:11px;line-height:16px;font-weight:500;color:var(--muted);justify-content:flex-end}
.tierrow span.on{color:var(--moss)}
.lines{display:flex;flex-direction:column;gap:16px}
.line{display:flex;gap:16px;align-items:flex-start}
.line img{width:72px;height:88px;object-fit:cover;flex:none;background:var(--sand)}
.line .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.line .acts{display:flex;gap:16px;padding-top:4px}
.line .acts button{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px;min-height:24px}
.sumbox{background:var(--sand);padding:32px;display:flex;flex-direction:column;gap:16px;position:sticky;top:24px}
.row{display:flex;justify-content:space-between;gap:16px;font-size:14px;line-height:20px;font-variant-numeric:tabular-nums}
.row.big{align-items:baseline}
.hair{height:1px;background:var(--line)}
.rw{display:flex;gap:12px;align-items:center;font-size:14px;line-height:20px}

@container app (max-width:900px){.cols{margin-top:20px}.sumbox{padding:20px}.tierrow{display:flex;justify-content:flex-end;gap:16px}.tierrow span:empty{display:none}}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:50;display:flex}
.ov .scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@keyframes slide{from{transform:translateX(100%)}}
@keyframes sheet{from{transform:translateY(100%)}}
.modal{position:relative;margin:auto;width:min(1200px,calc(100% - 64px));max-height:calc(100% - 64px);background:var(--paper);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);overflow:hidden;animation:up .25s ease-out}
.modal .mimg{background:var(--sand);min-height:0}
.modal .mimg img{width:100%;height:100%;object-fit:cover;max-height:calc(100vh - 64px)}
.modal .mbody{padding:40px;display:flex;flex-direction:column;gap:20px;overflow-y:auto;min-width:0}
.xbtn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;flex:none;margin:-10px -10px 0 0}
.xbtn:hover{background:var(--sand)}
.mhead{display:flex;gap:12px;align-items:flex-start}
.mhead>div{flex:1;display:flex;flex-direction:column;gap:4px}
.stock{display:flex;gap:8px;align-items:center;font-size:12px;line-height:20px;color:var(--rust)}
.alts{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.alt{display:flex;gap:12px;align-items:center}
.alt img{width:48px;height:56px;object-fit:cover;flex:none}
.alt .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.alt button{font-size:12px;line-height:16px;text-decoration:underline;text-underline-offset:3px;min-height:32px}
.grabber{display:none}
@container app (max-width:900px){
  .ov.qv{align-items:flex-end}
  .modal{width:100%;max-height:calc(100% - 84px);margin:0;grid-template-columns:1fr;overflow-y:auto;animation:sheet .28s ease-out;padding:12px 20px calc(32px + var(--sab))}
  .grabber{display:block;width:40px;height:4px;background:var(--line);margin:0 auto 12px}
  .modal .mimg{height:240px;flex:none}
  .modal .mimg img{max-height:240px}
  .modal .mbody{padding:12px 0 0;gap:12px;overflow:visible}
  .modal .d40{font-size:21px;line-height:28px;font-family:var(--display)}
  .modal .price{font-size:14px;line-height:20px;font-weight:400}
}
.drawer{position:relative;margin-left:auto;width:480px;max-width:100%;height:100%;background:var(--paper);display:flex;flex-direction:column;animation:slide .28s ease-out;box-shadow:-12px 0 40px rgba(20,20,20,.12)}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line)}
.dhead .xbtn{margin:-10px}
.ship{background:var(--sand);padding:16px 24px;display:flex;flex-direction:column;gap:8px}
.ship .msg{display:flex;gap:8px;align-items:center;font-size:12px;line-height:20px;color:var(--moss)}
.dbody{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.bline{display:flex;gap:16px}
.bline img{width:88px;height:104px;object-fit:cover;flex:none}
.bline .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.bline .tr{display:flex;justify-content:space-between;gap:16px}
.bitems{border:1px solid var(--line)}
.bitem{display:flex;gap:12px;align-items:center;padding:8px 16px 8px 16px}
.bitem+.bitem{border-top:1px solid var(--line)}
.bitem img{width:48px;height:48px;object-fit:cover;flex:none}
.bitem .t{flex:1;min-width:0;display:flex;flex-direction:column}
.bitem .t b{font-weight:400;font-size:14px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bitem button{font-size:12px;line-height:16px;text-decoration:underline;text-underline-offset:3px;min-height:32px}
.gwp{border:1px solid var(--line);display:flex;gap:12px;align-items:center;padding:12px 16px}
.gwp img{width:48px;height:48px;object-fit:cover}
.gwp .t{flex:1;display:flex;flex-direction:column}
.offer{background:var(--sand);display:flex;flex-direction:column;margin-top:auto;flex:none}
.offer-img{height:96px;background:var(--muted) center/cover}
.offer-body{padding:20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.offer .tiers .tag{background:var(--paper)}
.pairs{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.pairs .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pcard{display:flex;gap:12px;min-width:0}
.pcard img{width:72px;height:72px;object-fit:cover;flex:none}
.pcard .t{display:flex;flex-direction:column;gap:4px;min-width:0;align-items:flex-start}
.pcard button{font-size:12px;line-height:16px;text-decoration:underline;text-underline-offset:3px;min-height:24px}
.dfoot{border-top:1px solid var(--line);padding:20px 24px calc(24px + var(--sab));display:flex;flex-direction:column;gap:12px}
@container app (max-width:900px){
  .drawer{width:100%;box-shadow:none}
  .dhead{padding:20px 16px}.ship{padding:16px}.dbody{padding:24px 16px}.dfoot{padding:20px 16px calc(24px + var(--sab))}
  .pairs .cards{grid-template-columns:1fr}
}
.ov.warn{z-index:60}
.dialog{position:relative;margin:auto;width:420px;max-width:calc(100% - 32px);background:var(--paper);padding:32px;display:flex;flex-direction:column;gap:16px;animation:up .2s ease-out}
.dialog .head{display:flex;gap:12px;align-items:flex-start}
.dialog .head h2{flex:1}
.dialog .acts{display:flex;gap:12px}
.dialog .acts .btn{flex:1;padding:12px 16px}
@container app (max-width:900px){
  .ov.warn{align-items:flex-end}
  .dialog{width:100%;max-width:100%;margin:0;padding:24px 20px calc(32px + var(--sab));animation:sheet .25s ease-out}
  .dialog .acts{flex-direction:column-reverse}
}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:#fff;font-size:13px;line-height:20px;padding:12px 16px;max-width:calc(100% - 32px);width:max-content;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- checkout ---------- */
.co-head{display:flex;align-items:center;justify-content:space-between;padding:24px 160px;border-bottom:1px solid var(--line)}
.co-head .logo{font-size:26px;line-height:32px}
.co-head button{min-height:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center}
.co{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100% - 81px)}
.co-main{padding:48px 40px 48px 160px;display:flex;flex-direction:column;gap:32px;align-items:flex-end}
.co-main>*{width:100%;max-width:520px}
.co-side{background:var(--sand);border-left:1px solid var(--line);padding:48px 160px 40px 40px}
.co-side>div{max-width:520px;position:sticky;top:48px;display:flex;flex-direction:column;gap:24px}
.express{display:flex;flex-direction:column;gap:12px}
.express .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.express .btns button{height:48px;font-weight:700;font-size:16px;border-radius:4px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.fs{display:flex;flex-direction:column;gap:16px;border:0;margin:0;padding:0;min-width:0}
.fs legend{padding:0;margin-bottom:16px;width:100%;display:flex;justify-content:space-between;align-items:baseline}
.fs legend+*{margin-top:0}
.field{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{position:absolute;left:13px;top:6px;font-size:12px;line-height:20px;color:var(--muted);pointer-events:none}
.field input,.field select{height:52px;border:1px solid var(--line);background:var(--paper);padding:24px 12px 6px;font-size:14px;line-height:20px;width:100%;border-radius:0;appearance:none}
.field select{padding-right:36px}
.field .chev{position:absolute;right:12px;top:18px;pointer-events:none}
.field .trail{position:absolute;right:12px;top:18px;color:var(--muted)}
.field input:focus,.field select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.field input.ro{background:var(--sand);color:var(--muted);cursor:not-allowed}
.field.bad input{border-color:var(--rust);box-shadow:0 0 0 1px var(--rust)}
.ferr{display:flex;gap:8px;align-items:center;font-size:12px;line-height:20px;color:var(--rust)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow.three{grid-template-columns:1fr 1fr 1fr}
.check{display:flex;gap:12px;align-items:center;font-size:14px;line-height:20px;cursor:pointer;min-height:24px}
.check input{appearance:none;width:16px;height:16px;border:1px solid var(--ink);background:var(--paper);margin:0;display:grid;place-content:center;flex:none}
.check input:checked{background:var(--ink)}
.check input:checked::after{content:"";width:8px;height:5px;border:solid #fff;border-width:0 0 2px 2px;transform:translateY(-1px) rotate(-45deg)}
.opts{border:1px solid var(--line)}
.opt{display:flex;gap:12px;align-items:center;padding:16px;cursor:pointer;border:1px solid transparent;margin:-1px}
.opt+.opt,.opt+.panel,.panel+.opt{border-top-color:var(--line)}
.opt:has(input:checked){background:var(--sand);border-color:var(--ink);position:relative;z-index:1}
.opt input{appearance:none;width:16px;height:16px;border:1px solid var(--line);border-radius:50%;background:var(--paper);margin:0;flex:none}
.opt input:checked{border:5px solid var(--ink)}
.opt .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.brands{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.brand{font-size:10px;line-height:16px;font-weight:700;padding:3px 7px;border:1px solid var(--line);background:var(--paper)}
.panel{background:var(--sand);border-top:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}
.pay-err{display:flex;gap:12px;padding:16px;border:1px solid var(--rust);background:var(--sand)}
.pay-err b{display:block;color:var(--rust);font-weight:500;font-size:14px;line-height:20px}
.pay-err p{margin:4px 0 0;color:var(--moss);font-size:14px;line-height:20px}
.paybtn{height:56px;background:var(--ink);color:var(--paper);font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;width:100%}
.paybtn:hover{background:#2c2a27}
.paybtn[aria-busy="true"]{opacity:.7;cursor:progress}
.policies{display:flex;flex-wrap:wrap;gap:8px 16px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;line-height:20px}
.policies button{text-decoration:underline;text-underline-offset:3px;font-size:12px}
.oline{display:flex;gap:16px;align-items:flex-start}
.thumb{position:relative;width:64px;height:64px;flex:none;border:1px solid var(--line);background:var(--paper)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .q{position:absolute;top:-10px;right:-10px;min-width:20px;height:20px;padding:0 6px;background:var(--muted);color:var(--paper);border-radius:10px;font-size:12px;line-height:20px;font-weight:500;text-align:center}
.oline .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.note{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);background:var(--paper);font-size:12px;line-height:20px}
.disc{display:flex;gap:12px}
.disc .field{flex:1}
.disc .btn{min-height:52px;background:var(--line);border-color:var(--line);color:var(--muted)}
.disc .btn.ready{background:var(--ink);border-color:var(--ink);color:#fff}
.totals{display:flex;flex-direction:column;gap:8px}
.grand{display:flex;align-items:baseline;gap:8px}
.grand .d24{flex:1;font-size:26px}
.co-mtoggle{display:none}
@container app (max-width:1180px){.co-head{padding:24px 40px}.co-main{padding:48px 40px}.co-side{padding:48px 40px}}
@container app (max-width:900px){
  .co{grid-template-columns:1fr;display:flex;flex-direction:column}
  .co-side{order:-1;border-left:0;border-bottom:1px solid var(--line);padding:0}
  .co-side>div{position:static;max-width:none;padding:0 20px 24px}
  .co-side>div[data-collapsed="true"]{display:none}
  .co-mtoggle{display:flex;width:100%;justify-content:space-between;align-items:center;padding:16px;font-size:14px;line-height:20px;min-height:60px;background:var(--sand)}
  .co-mtoggle span:first-child{display:flex;gap:8px;align-items:center}
  .co-mtoggle[aria-expanded="true"] span:first-child .ic{transform:rotate(180deg)}
  .co-side>div{padding:0 16px 24px}
  .co-head{padding:16px}
  .co-main{padding:24px 16px 40px}
  .co-main{padding:32px 20px 48px;align-items:stretch}
  .co-main>*{max-width:none}
  .co-head{padding:16px 20px}
}
@container app (max-width:520px){
  .frow.three{grid-template-columns:1fr 1fr}
  .frow.three .field:first-child{grid-column:1/-1}
  .express .btns{gap:8px}
}

/* ---------- confirmation ---------- */
.thanks{display:flex;gap:16px;align-items:center}
.thanks .ck{width:48px;height:48px;border:1px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.box{border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:12px}
.box p{margin:0}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.dgrid div{display:flex;flex-direction:column;gap:4px;min-width:0;overflow-wrap:anywhere}
.dgrid b{font-weight:500}
.factions{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.factions .help{flex:1}
@container app (max-width:520px){.dgrid{grid-template-columns:1fr}.factions{flex-direction:column;align-items:stretch}.factions .btn{width:100%}}
</style>

<script>
(function(){

/* ---------- routing ---------- */
const ROUTES = ["product","builder","review","checkout","confirmation"];
let route = ROUTES.includes(location.hash.slice(1)) ? location.hash.slice(1) : "product";
function go(r, opts={}){
  route = r;
  if (location.hash.slice(1) !== r) { try { history.pushState(null,"","#"+r); } catch(e){ location.hash = r; } }
  render();
  if (!opts.keepScroll) { const sc = $("#scroller"); sc.style.scrollBehavior="auto"; sc.scrollTop = 0; sc.style.scrollBehavior=""; }
}
window.addEventListener("hashchange", ()=>{ const r = location.hash.slice(1); if (ROUTES.includes(r) && r!==route){ route=r; closeOverlay(true); render(); $("#scroller").scrollTop=0; }});
window.addEventListener("popstate", ()=>{ const r = location.hash.slice(1) || "product"; if (ROUTES.includes(r) && r!==route){ route=r; closeOverlay(true); render(); $("#scroller").scrollTop=0; }});

  return {t:"Both rewards unlocked: a free pouch and 10% off", ok:true};

/* ---------- 7 · checkout ---------- */
function orderTotals(){
  const sub = (S.cart.bundle?subtotal():0) + singlesTotal();
  const disc = S.cart.bundle?discount():0;
  const goods = sub - disc;
  const ship = S.form.delivery==="pickup" || goods>=FREE_SHIP ? 0 : 12;
  const tax = Math.round((goods+ship)*TAX*100)/100;
  const items = (S.cart.bundle?count():0) + (S.cart.bundle&&pouch()?1:0) + S.cart.singles.reduce((a,s)=>a+s.qty,0);
  return {sub, disc, goods, ship, tax, total: goods+ship+tax, items};
}
function orderSummary(editable){
  const t=orderTotals();
  const lines = [];
  if (S.cart.bundle){
    lines.push(`<div class="oline"><div class="thumb"><img src="${IMG("bundle")}" alt=""><span class="q">1</span></div>
      <div class="t"><span class="t14" style="font-weight:500">The Stillwater bundle</span>${S.items.map(it=>`<span class="t12 muted">${P[it.id].name} · ${optLabel(it.id,it.opt)}</span>`).join("")}</div><span class="t14 num">${money(subtotal())}</span></div>`);
    if (pouch()) lines.push(`<div class="oline"><div class="thumb"><img src="${IMG("pouch")}" alt=""><span class="q">1</span></div>
      <div class="t"><span class="t14" style="font-weight:500">The Stillwater Pouch</span><span class="t12 muted">Gift with purchase · 3+ products</span></div><span class="t14" style="font-weight:500">Free</span></div>`);
  }
  S.cart.singles.forEach(s=>lines.push(`<div class="oline"><div class="thumb"><img src="${IMG(s.id)}" alt=""><span class="q">${s.qty}</span></div>
      <div class="t"><span class="t14" style="font-weight:500">${P[s.id].name}</span><span class="t12 muted">${s.opt}</span></div><span class="t14 num">${money(P[s.id].price*s.qty)}</span></div>`));
  return `${lines.join("")}
    ${t.disc?`<div class="note">${svg("star")}<span>10% bundle discount applied: −${money(t.disc)}</span></div>`:""}
    ${editable?`<form class="disc" data-form="disc"><div class="field"><label for="f-disc">Discount code or gift card</label><input id="f-disc" autocomplete="off"></div><button class="btn" id="disc-btn" type="submit">Apply</button></form>`:""}
    <div class="totals">
      <div class="row"><span>Subtotal · ${t.items} items</span><span>${money(t.goods)}</span></div>
      <div class="row"><span>Shipping</span><span style="font-weight:500">${t.ship?money(t.ship):"FREE"}</span></div>
      <div class="row"><span>Estimated taxes</span><span>${money(t.tax)}</span></div>
    </div>

/* ---------- actions ---------- */
function addItem(id, opt){
  const p=P[id];
  opt = opt || (p.soldOut ? p.options.find(o=>!p.soldOut.includes(o)) : p.options[0]);
  const ex = S.items.find(i=>i.id===id);
  if (ex){ ex.opt=opt; return "updated"; }
  if (count()>=S.size){
    if (S.size===3){ S.size=4; S.items.push({id,opt}); S.lastAdded=id; toast("Switched to 4 for 10% off your bundle."); return "added"; }
    toast("Your bundle is full. Remove a product to swap one in.");
    return "full";
  }
  S.items.push({id,opt}); S.lastAdded=id;
  if (count()===3 && S.size===3) toast("Free Stillwater Pouch unlocked.");
  if (count()===4 && S.size===4) toast("Both rewards unlocked: a free pouch and 10% off.");
  return "added";
}
function rewardsAfterRemoving(){
  const c=count()-1;
  return {pouch:c>=3, ten:S.size===4 && c>=4};
}
function requestRemove(id){
  const before={pouch:pouch(), ten:tenOff()}, after=rewardsAfterRemoving();
  const losePouch = before.pouch && !after.pouch, loseTen = before.ten && !after.ten;
  if (!losePouch && !loseTen){ doRemove(id); return; }
  let text, tags=[];
  if (losePouch && loseTen){ text="Removing this item means you’ll lose your free pouch and 10% off your bundle."; tags=[["Free pouch lost","lost"],["10% off lost","lost"]]; }
  else if (loseTen){ text="Removing this item means you’ll lose 10% off your bundle. Your free pouch stays."; tags=[["Free pouch stays","ok"],["10% off lost","lost"]]; }
  else { text="Removing this item means you’ll lose your free Stillwater Pouch."; tags=[["Free pouch lost","lost"]]; }
  if (!overlay) lastFocus=document.activeElement;
  warnState={id,text,tags}; renderOverlay();
}
function doRemove(id){
  S.items = S.items.filter(i=>i.id!==id); S.lastAdded=null;
  if (!count()) S.cart.bundle=false;
  render(true); if (overlay) renderOverlay();
}
function preset(n){

  if (n===1) return go("product");
  if (n===2) return go("builder");
  if (n===3){ S.items=[{id:"perfume-oil",opt:"10 ml"}]; go("builder"); setTimeout(()=>scrollToCat("skin",true),30); openOverlay({type:"qv",id:"shell-compact"}); return; }
  if (n===4){ S.items=four.slice(0,3); return go("builder"); }
  S.size=4; S.items=four;
  if (n===5) return go("review");
  S.cart.bundle=true;
  if (n===6){ go("review"); openOverlay({type:"cart"}); return; }
  if (n===7) return go("checkout");
  if (n===8){ placeOrder(); return; }
}
function scrollToCat(id, instant){
  const el=$("#cat-"+id); if(!el) return;
  const sc=$("#scroller"); if (instant) sc.style.scrollBehavior="auto";
  sc.scrollTop = el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 16;
  if (instant) sc.style.scrollBehavior="";
}
function validate(){
  const f=S.form, E={};
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)) E.email="Enter a valid email";
  if (f.delivery==="ship"){
    if (!f.first.trim()) E.first="Enter a first name";
    if (!f.last.trim()) E.last="Enter a last name";
    if (!f.address.trim()) E.address="Enter an address";
    if (!f.city.trim()) E.city="Enter a city";
    if (!/^[A-Za-z]\d[A-Za-z] ?\d[A-Za-z]\d$/.test(f.postal.trim()) && f.country==="Canada") E.postal="Enter a valid postal code";
  }
  return E;
}
function placeOrder(){
  const t=orderTotals(), d=S.form.card.replace(/\D/g,"");
  S.order={form:{...S.form}, total:t.total, disc:t.disc, bundle:S.cart.bundle, pouch:S.cart.bundle&&pouch(),
    payLabel:S.form.pay==="card"?`Visa ending in ${d.slice(-4)}`:S.form.pay==="shoppay"?"Shop Pay":"PayPal", summary:orderSummary(false)};
  go("confirmation");
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  switch(a){
    case "nav-shop": closeOverlay(true); go("product"); break;
    case "nav-builder": closeOverlay(true); go("builder"); break;
    case "nav-soon": toast(`${el.dataset.what||"This page"} isn’t part of this prototype.`); break;
    case "nav-menu": openOverlay({type:"menu"}); break;
    case "open-cart": openOverlay({type:"cart"}); break;
    case "close": closeOverlay(); break;
    case "pdp-opt": S.pdpOption=el.dataset.opt; render(true); break;
    case "pdp-add": {
      const ex=S.cart.singles.find(s=>s.id==="perfume-oil"&&s.opt===S.pdpOption);
      if (ex) ex.qty++; else S.cart.singles.push({id:"perfume-oil",opt:S.pdpOption,qty:1});
      render(true); openOverlay({type:"cart"}); break;
    }
    case "qv": openOverlay({type:"qv",id}); break;
    case "qv-opt": overlay.opt=el.dataset.opt; renderOverlay(); break;
    case "qv-add": { const r=addItem(id, el.dataset.opt); closeOverlay(); render(true); if(r!=="full") flashPanel(); break; }
    case "swap-in": { const base=overlay&&overlay.id; const r=addItem(id); closeOverlay(); render(true); if(r!=="full"){ toast(`${P[id].name} added to your bundle.`); flashPanel(); } break; }
    case "toggle": if (inBundle(id)) requestRemove(id); else { const r=addItem(id); render(true); if(r!=="full") flashPanel(); } break;
    case "remove": requestRemove(id); break;
    case "warn-remove": { const w=warnState; warnState=null; doRemove(w.id); renderOverlay(); toast(`${P[w.id].name} removed.`); break; }
    case "warn-keep": warnState=null; renderOverlay(); break;
    case "size": {
      const n=+el.dataset.n;
      if (n===3 && count()>3){ toast("Remove a product first to switch to a bundle of 3."); break; }
      S.size=n; S.lastAdded=null; render(true); break;
    }
    case "pick": { const firstEmpty = CATS.find(c=>c.items.some(i=>!inBundle(i))); scrollToCat(firstEmpty?firstEmpty.id:"fragrance"); break; }
    case "to-panel": { const el2=$("#builder-panel"); if(el2) el2.scrollIntoView({behavior:"smooth",block:"start"}); break; }
    case "bestseller": S.items=BESTSELLER.map(([id,opt])=>({id,opt})); S.lastAdded=null; render(true); toast("Bestseller bundle added. Your free pouch is unlocked."); { const el2=$("#builder-panel"); if(el2) el2.scrollIntoView({behavior:"smooth",block:"start"}); } break;
    case "to-review": go("review"); break;
    case "swap": { const p=P[id]; go("builder"); setTimeout(()=>scrollToCat(p.cat,true),20); toast(`Pick a product to swap in for ${p.short}, then remove it.`); break; }
    case "add-bundle": S.cart.bundle=true; render(true); openOverlay({type:"cart"}); break;
    case "pair-add": { const r=addItem(id); render(true); renderOverlay(); if(r!=="full") toast(`${P[id].name} added to your bundle.`); break; }
    case "single-to-bundle": {
      const moved=[];
      S.cart.singles=S.cart.singles.filter(sg=>{ if(inBundle(sg.id) || count()>=S.size) return true; S.items.push({id:sg.id,opt:sg.opt}); moved.push(sg.id); if(sg.qty>1){ sg.qty--; return true; } return false; });
      closeOverlay(true); go("builder");
      const left=Math.max(0,3-count());
      if (moved.length) toast(`${P[moved[0]].name} is in your bundle.${left?` Pick ${left} more for a free pouch.`:""}`);
      break;
    }
    case "remove-single": S.cart.singles=S.cart.singles.filter(s=>s.id!==id); render(true); renderOverlay(); break;
    case "checkout": closeOverlay(true); checkoutErrors={}; S.payError=false; go("checkout"); break;
    case "express": toast("Express checkout opens the wallet’s own window. Use the card form for this prototype."); break;
    case "co-toggle": { const box=$("#co-sum"), open=box.dataset.collapsed!=="true"; box.dataset.collapsed=open?"true":"false"; el.setAttribute("aria-expanded",String(!open)); break; }
    case "restart-shop": S=fresh(); closeOverlay(true); go("product"); break;
  }
});
function flashPanel(){
  // on mobile, nudge the sticky bar so people see the bundle changed
  const bar=$("#mbar"); if(bar && bar.classList.contains("show")){ bar.animate([{transform:"translateY(-4px)"},{transform:"none"}],{duration:250}); }
}
document.addEventListener("input", e=>{
  const k=e.target.dataset && e.target.dataset.f; if(!k) return;
  if (e.target.type==="checkbox") S.form[k]=e.target.checked;
  else if (e.target.type==="radio"){ S.form[k]=e.target.value; }
  else {
    let v=e.target.value;
    S.form[k]=v;
    if (checkoutErrors[k]){ delete checkoutErrors[k]; const f=e.target.closest(".field"); f.classList.remove("bad"); const er=f.querySelector(".ferr"); if(er) er.remove(); e.target.removeAttribute("aria-invalid"); }
  }
  if (e.target.type==="radio" || k==="country") render(true);
  if (e.target.id==="f-disc"){ $("#disc-btn").classList.toggle("ready", !!e.target.value.trim()); }
});
document.addEventListener("change", e=>{ const k=e.target.dataset && e.target.dataset.f; if(k && e.target.tagName==="SELECT"){ S.form[k]=e.target.value; } });
document.addEventListener("submit", e=>{
  e.preventDefault();
  const form=e.target.dataset.form;
  if (form==="disc"){ const v=$("#f-disc").value.trim(); if(!v){ toast("Enter a discount code or gift card."); return; } toast(`“${v}” can’t be combined with your bundle rewards.`); return; }
  if (form==="checkout"){
    checkoutErrors=validate();
    const btn=$("#paybtn");
    // Flow 1 shows a declined payment once: the first card attempt fails, the retry goes through.
    if (!Object.keys(checkoutErrors).length && S.form.pay==="card" && S.payAttempts===0){
      S.payAttempts++; S.payError=true; render(true);
      const pe=$("#pay-err"); if(pe){ pe.scrollIntoView({block:"center"}); pe.focus({preventScroll:true}); }
      const b2=$("#paybtn"); if(b2) b2.textContent="Try again";
      return;
    }
    if (Object.keys(checkoutErrors).length){
      render(true);
      const first=$(".field.bad input"); const pe=$("#pay-err");
      (pe||first) && (pe||first).scrollIntoView({block:"center"});
      if (first) first.focus({preventScroll:true});
      return;
    }
    S.payError=false;
    btn.setAttribute("aria-busy","true"); btn.textContent="Processing…";
    setTimeout(placeOrder, 700);
  }
});
document.addEventListener("keydown", e=>{
  if (e.key==="Escape"){ if (warnState){ warnState=null; renderOverlay(); } else if (overlay) closeOverlay(); return; }
  if (e.key==="Tab"){
    const top=$("#overlays .ov:last-child"); if(!top) return;
    const f=[...top.querySelectorAll("button:not([disabled]),input,select,[tabindex]:not([tabindex='-1'])")].filter(x=>x.offsetParent!==null);
    if(!f.length) return; const first=f[0], last=f[f.length-1];
    if (e.shiftKey && document.activeElement===first){ last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement===last){ first.focus(); e.preventDefault(); }
  }
});

/* ---------- render ---------- */
let io;
function render(keepScroll){
  const sc=$("#scroller"), y=sc.scrollTop;
  const views={product:vProduct, builder:vBuilder, review:vReview, checkout:vCheckout, confirmation:vConfirmation};
  $("#app").innerHTML=views[route]();
  if (keepScroll){ sc.style.scrollBehavior="auto"; sc.scrollTop=y; sc.style.scrollBehavior=""; }
  S.lastAdded=null;
  // mobile gallery dots
  const tr=$("#mtrack"); if(tr) tr.addEventListener("scroll",()=>{ const i=Math.round(tr.scrollLeft/tr.clientWidth); document.querySelectorAll(".dots i").forEach((d,j)=>d.classList.toggle("on",i===j)); },{passive:true});
  // mobile sticky bundle bar
  if (io) io.disconnect();
  const panel=$("#builder-panel"), bar=$("#mbar");
  if (panel && bar && "IntersectionObserver" in window){
    io=new IntersectionObserver(([en])=>{ const show=!en.isIntersecting; bar.classList.toggle("show",show); bar.setAttribute("aria-hidden",String(!show)); bar.querySelectorAll("button").forEach(b=>b.tabIndex=show?0:-1); },{root:sc,threshold:0});
    io.observe(panel);
  }
  document.title = "Stillwater Build Your Bundle";
}

/* ---------- controls ---------- */
function fitPhone(){
  const st=$("#stage"); const s=Math.min(1,(st.clientHeight-32)/878,(st.clientWidth-32)/419);
  document.body.style.setProperty("--s", Math.max(.4,s).toFixed(3));
}
window.addEventListener("resize", fitPhone);
function setDevice(m){
  document.body.classList.toggle("phone", m==="mobile");
  fitPhone();
  $("#dev-desktop").setAttribute("aria-pressed",String(m!=="mobile"));
  $("#dev-mobile").setAttribute("aria-pressed",String(m==="mobile"));
  try{ localStorage.setItem("sw-device",m); }catch(e){}
}
$("#dev-desktop").addEventListener("click",()=>setDevice("desktop"));
$("#dev-mobile").addEventListener("click",()=>setDevice("mobile"));
$("#jump").addEventListener("change",e=>{ const v=+e.target.value; if(v){ preset(v); } e.target.value=""; });
$("#restart").addEventListener("click",()=>preset(1));
const FORCE=document.documentElement.dataset.force;
let dev="desktop"; try{ dev=localStorage.getItem("sw-device")||"desktop"; }catch(e){}
if (FORCE==="iphone") dev="mobile";
if (window.innerWidth<520) dev="desktop"; // on a real phone, show the storefront full screen instead of a phone inside a phone
setDevice(dev);
render();
})();
</script>
